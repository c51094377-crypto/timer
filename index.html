<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>拳検出リアクションタイマー</title>
<style>
:root{color-scheme:dark;--bg:#0b1220;--panel:#131e30;--line:#293a52;--accent:#64e6b5;--text:#eef5ff;--muted:#a8b8cc}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif;padding:18px;min-height:100vh;display:grid;place-items:center}
main{width:min(760px,100%)}h1{font-size:clamp(1.35rem,4vw,2rem);margin:0 0 8px}.sub{color:var(--muted);margin:0 0 18px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}
video{width:100%;max-height:52vh;object-fit:cover;transform:scaleX(-1);background:#05080e;border-radius:12px;display:block}canvas{display:none}
.time{font-size:clamp(2.7rem,12vw,5rem);font-variant-numeric:tabular-nums;font-weight:750;letter-spacing:-.04em;text-align:center;margin:8px 0}.status{text-align:center;color:var(--muted);min-height:1.5em}
.buttons{display:flex;gap:10px;flex-wrap:wrap}button{flex:1;min-width:120px;border:0;border-radius:12px;padding:14px 16px;font:inherit;font-weight:700;cursor:pointer}#start{background:var(--accent);color:#082016}#reset{background:#26364d;color:var(--text)}button:disabled{opacity:.45;cursor:not-allowed}.hint{font-size:.92rem;line-height:1.6;color:var(--muted)}.pill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:.8rem;color:var(--muted)}
</style>
</head>
<body><main>
<h1>拳検出リアクションタイマー</h1><p class="sub">スタート後、カメラに開いた手を見せてから拳を握ると計測が止まります。</p>
<div class="panel"><video id="video" autoplay playsinline muted></video><canvas id="canvas"></canvas><p id="status" class="status">スタートを押すとカメラが起動します。</p></div>
<div class="panel"><div class="pill">計測時間</div><div id="time" class="time">0.000 秒</div><div class="buttons"><button id="start">スタート</button><button id="reset" disabled>リセット</button></div></div>
<div class="panel hint"><strong>使い方</strong><br>1. 明るい場所で、手がカメラに十分映る位置にする。<br>2. スタート後、開いた手をカメラに見せる。<br>3. 画面に「計測中」と出たら拳を握る。検出すると停止する。<br><br>カメラ映像の処理はブラウザ内で行います。初回読み込みにはインターネット接続が必要です。カメラ利用にはHTTPSのページ（GitHub Pagesなど）かlocalhostが必要です。</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script>
const video=document.getElementById('video'), canvas=document.getElementById('canvas'), ctx=canvas.getContext('2d');
const timeEl=document.getElementById('time'), statusEl=document.getElementById('status'), startBtn=document.getElementById('start'), resetBtn=document.getElementById('reset');
let camera=null, running=false, armed=false, startAt=0, raf=0, fistFrames=0, openFrames=0, lastResult='';
function setStatus(s){statusEl.textContent=s}
function fmt(ms){return (ms/1000).toFixed(3)+' 秒'}
function tick(){if(!running)return;timeEl.textContent=fmt(performance.now()-startAt);raf=requestAnimationFrame(tick)}
function isFist(lm){
  // Four fingertips curled below their PIP joints in the mirrored preview's image coordinates.
  const curled=[[8,6],[12,10],[16,14],[20,18]].filter(([tip,pip])=>lm[tip].y>lm[pip].y+0.015).length;
  const thumbFolded=Math.hypot(lm[4].x-lm[5].x,lm[4].y-lm[5].y)<0.20;
  return curled>=3 && thumbFolded;
}
function onResults(results){
  if(!running)return;
  const hands=results.multiHandLandmarks;
  if(!hands||!hands.length){fistFrames=0;openFrames=0;lastResult='';setStatus(armed?'計測中：手が見える位置に戻してね':'手をカメラに映してね');return}
  const lm=hands[0], fist=isFist(lm);
  if(!armed){
    if(!fist){openFrames++;}else{openFrames=0;}
    if(openFrames>=3){armed=true;setStatus('計測中：拳を握ると停止します');}
    else setStatus('開いた手をカメラに見せてね');
    return;
  }
  if(fist){fistFrames++;}else{fistFrames=0;}
  if(fistFrames>=3){
    running=false;cancelAnimationFrame(raf);timeEl.textContent=fmt(performance.now()-startAt);setStatus('停止！ 計測結果：'+timeEl.textContent);startBtn.disabled=false;resetBtn.disabled=false;
    if(camera){camera.stop();camera=null;} if(video.srcObject){video.srcObject.getTracks().forEach(t=>t.stop());video.srcObject=null;}
  }
}
async function start(){
  if(running)return;
  if(!window.Hands||!window.Camera){setStatus('認識ライブラリを読み込めません。インターネット接続を確認して再読み込みしてね。');return;}
  startBtn.disabled=true;resetBtn.disabled=true;setStatus('カメラを起動しています…');
  try{
    const hands=new Hands({locateFile:(file)=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
    hands.setOptions({maxNumHands:1,modelComplexity:0,minDetectionConfidence:0.65,minTrackingConfidence:0.6});
    hands.onResults(onResults);
    camera=new Camera(video,{onFrame:async()=>{if(running)await hands.send({image:video});},width:640,height:480});
    await camera.start();
    running=true;armed=false;openFrames=0;fistFrames=0;startAt=performance.now();timeEl.textContent='0.000 秒';tick();setStatus('開いた手をカメラに見せてね');resetBtn.disabled=false;
  }catch(e){running=false;startBtn.disabled=false;resetBtn.disabled=true;setStatus('カメラを起動できませんでした。ブラウザのカメラ許可とHTTPS接続を確認してね。');}
}
function reset(){running=false;cancelAnimationFrame(raf);if(camera){camera.stop();camera=null;}if(video.srcObject){video.srcObject.getTracks().forEach(t=>t.stop());video.srcObject=null;}armed=false;openFrames=0;fistFrames=0;timeEl.textContent='0.000 秒';setStatus('スタートを押すとカメラが起動します。');startBtn.disabled=false;resetBtn.disabled=true;}
startBtn.addEventListener('click',start);resetBtn.addEventListener('click',reset);
</script></body></html>
